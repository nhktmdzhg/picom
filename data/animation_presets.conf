geometry-change = {
    scale-x = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-width-before / window-width";
        end = 1;
    };
    scale-y = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-height-before / window-height";
        end = 1;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-x-before - window-x";
        end = 0;
    };
    offset-y = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-y-before - window-y";
        end = 0;
    };
    saved-image-blend = {
        duration = "placeholder0";
        start = 1;
        end = 0;
    };
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    *knobs = {
        duration = 0.4;
    };
    *placeholders = ((0, "duration"));
};


# =============================================================================
# Shader-based open/close animation presets, ported from Burn-My-Windows.
# These presets apply a custom GLSL fragment shader to the window while the
# animation runs. They only work with the glx and egl backends; on other
# backends the shader is ignored and the animation has no visible effect.
# The effect parameters are hardcoded in data/shaders/bmw-<nick>.frag; copy
# the file and adjust the `shader` option to customize them.
# =============================================================================
fire-in = {
    # Keep the window at its natural opacity for the whole animation; the
    # visual effect is entirely in the shader (GLX/EGL backends only).
    opacity = 1;
    raw-progress = {
        curve = "linear";
        duration = "placeholder0";
        start = 0;
        end = 1;
    };
    shader-progress = "raw-progress";
    shader-duration = "0 - placeholder0";
    shader = "bmw-fire.frag";
    *knobs = {
        duration = 1.5;
    };
    *placeholders = ((0, "duration"));
};

