name: "CodeQL"

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm gcc git meson ninja make pkgconf cmake which uthash libconfig \
            libdbus libepoxy libev libx11 libxcb pcre2 pixman xcb-util \
            xcb-util-image xcb-util-renderutil libglvnd mesa xorgproto \
            nodejs python

      - name: Checkout repository
        uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          meson setup build
          ninja -C build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
